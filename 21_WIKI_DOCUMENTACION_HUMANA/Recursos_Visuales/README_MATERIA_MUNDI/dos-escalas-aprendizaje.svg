<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Dos escalas de aprendizaje</title><desc id="d">H1 a H10 forman el recorrido histórico. U1, U2, U13 PROEMA, U14 y U15 constituyen trayectorias longitudinales que conectan evidencias y reflexiones.</desc><rect width="1200" height="420" rx="20" fill="#f8f6f0"/><text x="40" y="52" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#153b49">Dos escalas, una experiencia de aprendizaje</text><text x="40" y="83" font-family="Arial,sans-serif" font-size="16" fill="#47646b">Diez hitos históricos avanzan mientras cinco trayectorias mantienen la continuidad del aprendizaje.</text><rect x="35" y="105" width="1130" height="143" rx="16" fill="#e5efeb" stroke="#abc9c3"/><text x="57" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#174352">RECORRIDO HISTÓRICO · U03–U12</text><path d="M93 190H1090" stroke="#ac814b" stroke-width="6"/><circle cx="94" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="94" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H1</text><circle cx="204" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="204" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H2</text><circle cx="314" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="314" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H3</text><circle cx="424" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="424" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H4</text><circle cx="534" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="534" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H5</text><circle cx="644" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="644" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H6</text><circle cx="754" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="754" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H7</text><circle cx="864" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="864" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H8</text><circle cx="974" cy="190" r="25" fill="#153e50" stroke="#f9e6bd" stroke-width="3"/><text x="974" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H9</text><circle cx="1084" cy="190" r="25" fill="#aa7549" stroke="#f9e6bd" stroke-width="3"/><text x="1084" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">H10</text><g font-family="Arial,sans-serif" font-size="14" fill="#40616a" text-anchor="middle"><text x="219" y="229">Primeras explicaciones</text><text x="594" y="229">Medición, modelos y evidencia</text><text x="969" y="229">Consecuencias y responsabilidad</text></g><rect x="35" y="263" width="1130" height="126" rx="16" fill="#f1e6d6" stroke="#d1b995"/><text x="57" y="294" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#694b31">TRAYECTORIAS LONGITUDINALES · A TRAVÉS DEL CURSO</text><g font-family="Arial,sans-serif" text-anchor="middle" font-size="20" font-weight="bold"><rect x="58" y="313" width="150" height="53" rx="12" fill="#decdb1"/><text x="133" y="348" fill="#4d3c2c">U1</text><rect x="223" y="313" width="150" height="53" rx="12" fill="#decdb1"/><text x="298" y="348" fill="#4d3c2c">U2</text><rect x="388" y="313" width="240" height="53" rx="12" fill="#ae7548"/><text x="508" y="348" fill="white">U13 · PROEMA</text><rect x="643" y="313" width="235" height="53" rx="12" fill="#decdb1"/><text x="760.5" y="348" fill="#4d3c2c">U14 · Producción</text><rect x="893" y="313" width="248" height="53" rx="12" fill="#decdb1"/><text x="1017" y="348" fill="#4d3c2c">U15 · Síntesis</text></g><text x="47" y="410" font-family="Arial,sans-serif" font-size="13" fill="#526768">Esquema conceptual: no representa cronograma, actividades completadas ni resultados empíricos.</text></svg>